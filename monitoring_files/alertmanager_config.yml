global:
  resolve_timeout: 1m
  smtp_smarthost: 'smtp.yandex.ru:465'
  smtp_from: '123@mail.local'
  smtp_auth_username: '123@mail.local'
  smtp_auth_password: '123'
  smtp_require_tls: false

route:
  receiver: 'all' 
  group_by:
    - alertname
    - instance
  group_wait: 10s
  group_interval: 10s

receivers:
- name: 'all'
  telegram_configs:
  - api_url: https://api.telegram.org
    bot_token: '123'
    chat_id: 123
    send_resolved: true
  email_configs:
  - to: '123@mail.local'
    send_resolved: true
